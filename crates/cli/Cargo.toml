[package]
name = "bettertunes-cli"
description = "betterTunes command-line interface"
version.workspace = true
license.workspace = true
edition.workspace = true

[[bin]]
name = "bt"
path = "src/main.rs"

[dependencies]
bettertunes-core = { path = "../core" }
bettertunes-device = { path = "../device" }
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
plist = "1"
ratatui = "0.30"
rusqlite = { version = "0.37", features = ["bundled"] }
